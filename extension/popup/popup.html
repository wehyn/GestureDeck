<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GestureDeck Canva</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">GESTUREDECK · CANVA</p>
      <h1>Phone control</h1>
      <p id="status" role="status" aria-live="polite">Checking Canva tab…</p>
      <button id="connect" type="button">Connect this presentation</button>
      <button id="disconnect" type="button" hidden>Disconnect Canva</button>
      <button id="show-phone-pairing" type="button" disabled>Show phone QR/link</button>
      <p id="phone-pairing-hint" class="hint">Connect a Canva presentation in Present or View mode first.</p>
    </main>
  </body>
</html>
